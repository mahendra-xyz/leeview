<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Bebas+Neue&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #111; padding: 40px; }
  body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Inter', sans-serif; flex-shrink: 0; }

  .wrap {
    width: 1080px;
    height: 1080px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(150deg, #0a1a30 0%, #1B3461 55%, #0c2545 100%);
    overflow: hidden;
  }

  .grid {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .bar-left   { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: #2F7A2F; }
  .bar-right  { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; background: #2F7A2F; }
  .bar-top    { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: #2F7A2F; }
  .bar-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 6px; background: #2F7A2F; }

  .circle1 {
    position: absolute;
    right: -100px;
    bottom: -100px;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    border: 80px solid rgba(47,122,47,0.07);
  }
  .circle2 {
    position: absolute;
    left: -60px;
    top: -80px;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    border: 50px solid rgba(255,255,255,0.025);
  }

  /* Green accent block */
  .accent-block {
    position: absolute;
    top: 0;
    left: 8px; /* after bar */
    right: 8px;
    height: 5px;
    background: transparent;
  }

  .content {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 80px;
    gap: 0;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 40px;
  }
  .eyebrow-line { width: 40px; height: 2px; background: #2F7A2F; }
  .eyebrow-text {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #7ec87e;
  }

  .headline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 108px;
    color: #fff;
    letter-spacing: 0.03em;
    line-height: 0.95;
    margin-bottom: 36px;
  }

  .headline span {
    color: #7ec87e;
  }

  .body-text {
    font-size: 20px;
    color: rgba(255,255,255,0.5);
    line-height: 1.5;
    max-width: 560px;
    margin-bottom: 60px;
  }

  /* Phone pill */
  .phone-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 48px;
  }

  .phone-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #7ec87e;
  }

  .phone {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 72px;
    color: #fff;
    letter-spacing: 0.06em;
    line-height: 1;
  }

  .divider {
    width: 1px;
    height: 50px;
    background: rgba(255,255,255,0.12);
    margin-bottom: 48px;
  }

  .footer-row {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .logo-small {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.04em;
  }

  .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
  }

  .url {
    font-size: 13px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="grid"></div>
  <div class="bar-left"></div>
  <div class="bar-right"></div>
  <div class="bar-top"></div>
  <div class="bar-bottom"></div>
  <div class="circle1"></div>
  <div class="circle2"></div>

  <div class="content">
    <div class="eyebrow">
      <div class="eyebrow-line"></div>
      <span class="eyebrow-text">Free No-Obligation Quote</span>
      <div class="eyebrow-line"></div>
    </div>
    <div class="headline">Get Your<br><span>Property</span><br>Sorted</div>
    <div class="body-text">Based in Ballincollig, serving Cork<br>and surrounding areas.</div>
    <div class="phone-block">
      <div class="phone-label">Call or Text</div>
      <div class="phone">085 181 8163</div>
    </div>
    <div class="divider"></div>
    <div class="footer-row">
      <div class="logo-small">Leeview</div>
      <div class="dot"></div>
      <div class="url">leeviewpropertymaintenance.ie</div>
    </div>
  </div>
</div>
</body>
</html>
