<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Bebas+Neue&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { min-height: 100%; display: flex; align-items: center; justify-content: center; background: #111; padding: 40px; }
  body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Inter', sans-serif; flex-shrink: 0; }

  .wrap {
    width: 1080px;
    height: 1080px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(150deg, #0a1a30 0%, #1B3461 55%, #0c2545 100%);
    overflow: hidden;
  }

  .grid {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .bar-left   { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: #2F7A2F; }
  .bar-right  { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; background: #2F7A2F; }
  .bar-top    { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: #2F7A2F; }
  .bar-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 6px; background: #2F7A2F; }

  .circle1 {
    position: absolute;
    right: -120px;
    top: -120px;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    border: 80px solid rgba(47,122,47,0.08);
  }

  .circle2 {
    position: absolute;
    left: -80px;
    bottom: -100px;
    width: 360px;
    height: 360px;
    border-radius: 50%;
    border: 50px solid rgba(255,255,255,0.025);
  }

  .content {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 80px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 32px;
  }
  .eyebrow-line { width: 36px; height: 2px; background: #2F7A2F; }
  .eyebrow-text {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #7ec87e;
  }

  .logo-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 140px;
    color: #fff;
    letter-spacing: 0.04em;
    line-height: 1;
  }

  .logo-sub {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #7ec87e;
    margin-top: 4px;
    margin-bottom: 40px;
  }

  .divider {
    width: 60px;
    height: 2px;
    background: rgba(255,255,255,0.15);
    margin-bottom: 40px;
  }

  .tagline {
    font-size: 22px;
    color: rgba(255,255,255,0.6);
    line-height: 1.5;
    max-width: 600px;
    margin-bottom: 48px;
  }

  .tags {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 56px;
  }
  .tag {
    padding: 8px 20px;
    border: 1px solid rgba(255,255,255,0.18);
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .url {
    font-size: 14px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="grid"></div>
  <div class="bar-left"></div>
  <div class="bar-right"></div>
  <div class="bar-top"></div>
  <div class="bar-bottom"></div>
  <div class="circle1"></div>
  <div class="circle2"></div>

  <div class="content">
    <div class="eyebrow">
      <div class="eyebrow-line"></div>
      <span class="eyebrow-text">Cork &amp; Surrounding Areas</span>
      <div class="eyebrow-line"></div>
    </div>
    <div class="logo-name">Leeview</div>
    <div class="logo-sub">Property Maintenance</div>
    <div class="divider"></div>
    <div class="tagline">Keeping your property looking<br>its best — every time.</div>
    <div class="tags">
      <div class="tag">Local</div>
      <div class="tag">Reliable</div>
      <div class="tag">Fully Insured</div>
      <div class="tag">Professional</div>
    </div>
    <div class="url">leeviewpropertymaintenance.ie</div>
  </div>
</div>
</body>
</html>
